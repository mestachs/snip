<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snip</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
        background: #222;
        color: #eee;
      }
      button {
        padding: 0.5rem 1rem;
        font-size: 1rem;
      }
      #preview {
        margin-top: 2rem;
        max-width: 100%;
        border: 1px solid #444;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <button onclick="captureScreenWithStyledBorder()">Capture Screen</button>
    <div>
      <canvas id="previewCanvas">
    </div>

    <script>
      async function captureScreenWithStyledBorder() {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
        });
        const video = document.createElement("video");
        video.srcObject = stream;

        await video.play();

        await Promise.race([
          new Promise((resolve) => {
            if (video.readyState >= 2) resolve();
            else video.oncanplay = () => resolve();
          }),
          new Promise((_, reject) =>
            setTimeout(() => reject(new Error("Video timeout")), 3000)
          ),
        ]);

        const padding = 50;
        const radius = 20;
        const titleBarHeight = 40;
        const width = video.videoWidth;
        const height = video.videoHeight;

        const canvas = document.getElementById('previewCanvas')
        canvas.width = width + padding * 2;
        canvas.height = height + padding * 2 + titleBarHeight;
        const ctx = canvas.getContext("2d");

        const grd = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        grd.addColorStop(0, "#5e5e5e");
        grd.addColorStop(1, "#2c2c2c");
        ctx.fillStyle = grd;
        roundRect(ctx, 0, 0, canvas.width, canvas.height, radius);
        ctx.fill();

        ctx.fillStyle = "#1e1e1e";
        roundRect(ctx, 0, 0, canvas.width, titleBarHeight + 10, {
          tl: radius,
          tr: radius,
          br: 0,
          bl: 0,
        });
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = "16px sans-serif";
        ctx.fillText("Snip", 90, 26);

        const controls = [
          { color: "#ff5f57", x: 20 },
          { color: "#ffbd2e", x: 40 },
          { color: "#28c840", x: 60 },
        ];
        controls.forEach((c) => {
          ctx.beginPath();
          ctx.arc(c.x, 20, 6, 0, 2 * Math.PI);
          ctx.fillStyle = c.color;
          ctx.fill();
        });

        ctx.drawImage(video, padding, padding + titleBarHeight, width, height);
        stream.getTracks().forEach((t) => t.stop());

        const dataUrl = canvas.toDataURL("image/png");

        const a = document.createElement("a");
        a.href = dataUrl;
        a.download = "screenshot.png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        let start = null;

        canvas.addEventListener("mousedown", (e) => {
          const rect = canvas.getBoundingClientRect();
          start = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });

        canvas.addEventListener("mouseup", (e) => {
          if (!start) return;
          const rect = canvas.getBoundingClientRect();
          const end = { x: e.clientX - rect.left, y: e.clientY - rect.top };
          drawArrow(ctx, start, end);
          start = null;
        });

        function drawArrow(ctx, from, to) {
          const headLength = 10;
          const dx = to.x - from.x;
          const dy = to.y - from.y;
          const angle = Math.atan2(dy, dx);

          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.strokeStyle = "red";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(to.x, to.y);
          ctx.lineTo(
            to.x - headLength * Math.cos(angle - Math.PI / 6),
            to.y - headLength * Math.sin(angle - Math.PI / 6)
          );
          ctx.lineTo(
            to.x - headLength * Math.cos(angle + Math.PI / 6),
            to.y - headLength * Math.sin(angle + Math.PI / 6)
          );
          ctx.lineTo(to.x, to.y);
          ctx.fillStyle = "red";
          ctx.fill();
        }
      }

      function roundRect(ctx, x, y, w, h, r) {
        if (typeof r === "number") r = { tl: r, tr: r, br: r, bl: r };
        else r = Object.assign({ tl: 0, tr: 0, br: 0, bl: 0 }, r);

        ctx.beginPath();
        ctx.moveTo(x + r.tl, y);
        ctx.lineTo(x + w - r.tr, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r.tr);
        ctx.lineTo(x + w, y + h - r.br);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r.br, y + h);
        ctx.lineTo(x + r.bl, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r.bl);
        ctx.lineTo(x, y + r.tl);
        ctx.quadraticCurveTo(x, y, x + r.tl, y);
        ctx.closePath();
      }
    </script>
  </body>
</html>
